[package]
name = "logs"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
futures = "0.3.32"
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
kube = { version = "4.0.0", features = ["runtime", "derive"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
log4rs = { version = "1.4.0", features = ["json_encoder"] }
log = "0.4.33"
chrono = "0.4.45"
urlencoding = "2.1.3"
rustls = { version = "0.23.41", default-features = false, features = ["aws-lc-rs"] }
regex = "1.12.4"
